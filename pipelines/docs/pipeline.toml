[pipeline]
name = "docs"
description = "Write or update documentation, independently verify every claim, command and link against the code, then ship; use quick-pr for a typo"
version = 1
workspace = "worktree"
requires_repo = true

[nudges]
tier = "balanced"
independent_reviewers = true
notes = "For README, guides, API/reference docs, changelogs and docstrings. Fast or balanced tier is enough, with an independent reviewer. Use quick-pr for a typo."

[[stage]]
id = "write"
kind = "work"
prompt = "write.md"
timeout_minutes = 120
nudge = "A fast or balanced model with enough effort to trace claims to the code."

[[stage]]
id = "verify"
kind = "review"
prompt = "verify.md"
gate = "all_pass"
timeout_minutes = 60
nudge = "Prefer an independent reviewer different from the writer when the allowlist permits."
on_fail = { goto = "write", max_loops = 2 }

[[stage]]
id = "ship"
kind = "ship"
prompt = "ship.md"
timeout_minutes = 90
nudge = "A fast model at low effort is enough for both ship modes."
