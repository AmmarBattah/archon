<text x="20" y="311">Observed graded-trial means; infrastructure failures excluded. v1/v2 are incomplete and task weights differ.</text>
<text x="20" y="331">Smoke uses Haiku and four tasks (two new); older snapshots use Opus. Compare like configurations. Small samples do not establish reliability.</text>
